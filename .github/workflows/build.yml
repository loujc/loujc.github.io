name: Build

env:
  NODE_VERSION: '22'

on:
  # Standalone trigger for PR validation
  pull_request:
    branches: ['main']
  # Reusable workflow trigger - called by deploy.yml
  workflow_call:
    secrets:
      ICLOUD_CALDAV_USERNAME:
        required: true
      ICLOUD_CALDAV_APP_PASSWORD:
        required: true
      ICLOUD_CALDAV_BASE_URL:
        required: true
      ICLOUD_CALDAV_CALENDAR_NAMES_JSON:
        required: true
      ICLOUD_CALDAV_ALL_DAY_BUSY_CALENDAR_NAMES_JSON:
        required: true
      IDEA_BUSY_SNAPSHOT:
        required: true
    outputs:
      artifact_id:
        description: 'The ID of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact_id }}
  # Allow manual trigger for testing
  workflow_dispatch:

# Read-only permissions for security
permissions:
  contents: read

# Prevent duplicate builds for the same PR
concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  availability:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout calendar code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

    - name: Install locked calendar dependencies without lifecycle scripts
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Test calendar privacy contract
      run: pnpm run calendar:test

    - name: Generate anonymized availability from private calendar sources
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      env:
        ICLOUD_CALDAV_USERNAME: ${{ secrets.ICLOUD_CALDAV_USERNAME }}
        ICLOUD_CALDAV_APP_PASSWORD: ${{ secrets.ICLOUD_CALDAV_APP_PASSWORD }}
        ICLOUD_CALDAV_BASE_URL: ${{ secrets.ICLOUD_CALDAV_BASE_URL }}
        ICLOUD_CALDAV_CALENDAR_NAMES_JSON: ${{ secrets.ICLOUD_CALDAV_CALENDAR_NAMES_JSON }}
        ICLOUD_CALDAV_ALL_DAY_BUSY_CALENDAR_NAMES_JSON: ${{ secrets.ICLOUD_CALDAV_ALL_DAY_BUSY_CALENDAR_NAMES_JSON }}
        IDEA_BUSY_SNAPSHOT: ${{ secrets.IDEA_BUSY_SNAPSHOT }}
      run: node scripts/generate-busy-calendar.mjs --require-sources

    - name: Generate fail-closed availability without calendar feeds
      if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
      run: node scripts/generate-busy-calendar.mjs

    - name: Upload anonymous availability only
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: anonymous-availability-${{ github.run_id }}
        path: public/availability/busy.json
        if-no-files-found: error
        retention-days: 1

  build:
    needs: availability
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
    - name: Checkout static site branch
      uses: actions/checkout@v6
      with:
        ref: glm53flash

    - name: Assemble public directory
      run: |
        mkdir -p public/availability
        cp -a index.html style.css script.js portrait.jpg README.md uploads availability-snapshot.json .nojekyll public/

    - name: Download anonymous availability
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: anonymous-availability-${{ github.run_id }}
        path: public/availability

    - name: Upload artifact
      id: upload
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public
