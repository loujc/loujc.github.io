bio: |
  **楼锦程，ChipBagel 创始人兼 CEO。** 北京大学 / Agent 领域连续创业者 /
  EDA & 芯片经验。北京大学集成电路学院博士生、硕士，师从林亦波教授；
  现任学院双创委员、团委副书记（学生最高职位），同时担任东北大学校友导师，
  曾任北京大学创新学社副会长。

  已发表多篇领域顶级会议论文，获 ICCAD 与 ISEDA 最佳论文提名奖。
  曾在独角兽 AI 芯片公司负责 NPU 算法设计与优化，多次参与 22 nm 至 28 nm
  工艺流片。曾获“复微杯”全国第二名、EDA 精英挑战赛企业特别奖/全国二等奖、
  全国大学生智能汽车竞赛全国一等奖、北京大学挑战杯一等奖等三十余项国家、
  省、市级奖项。

  曾创办天使轮 Agent 硬件公司 Takway.AI，并在 CES 获多国头部媒体报道；
  是千星开源项目 AutoResearch 的 contributor。此前参与研发的机器人已落地
  上海交通大学闵行校区图书馆主馆。

