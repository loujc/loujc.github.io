bio: |
  **Jincheng Lou is the Founder & CEO of ChipBagel**, a serial entrepreneur in
  AI agents with experience spanning EDA and chip design. He is a Ph.D.
  candidate at Peking University's School of Integrated Circuits, advised by
  Prof. Yibo Lin. He serves on the School's Innovation and Entrepreneurship
  Committee and as Deputy Secretary of its Youth League Committee, the highest
  student leadership position. He is also a Northeastern University alumni
  mentor and previously served as Vice President of the Peking University
  Innovation Society.

  He has authored or co-authored papers at leading conferences in the field,
  including Best Paper Nominations at ICCAD and ISEDA. He previously worked on
  NPU algorithm design and optimization at a
  unicorn AI-chip company and participated in multiple 22 nm to 28 nm tapeouts.
  His honors include the national runner-up award in the Fuwei Cup, the
  Enterprise Special Award and National Second Prize in the EDA Elite
  Challenge, a National First Prize in the National College Intelligent Car
  Competition, and a First Prize in the Peking University Challenge Cup, among
  more than 30 national, provincial, and municipal awards.

  Before ChipBagel, he founded the angel-funded agent-hardware company
  Takway.AI, which received coverage from leading international media at CES.
  He is a contributor to the thousand-star AutoResearch repository. His earlier
  robotics work was deployed in the main library at Shanghai Jiao Tong
  University's Minhang campus.

