{{- $wechatID := site.Params.hugoblox.identity.social.wechat | default "" -}}
{{- if $wechatID -}}
<div id="wechat-copy-toast" class="wechat-copy-toast" role="status" aria-live="polite"></div>
<script>
  (() => {
    const wechatId = {{ $wechatID | jsonify | safeJS }};
    const triggers = document.querySelectorAll('a[href="#wechat-copy"], a[href$="/#wechat-copy"]');
    const toast = document.getElementById('wechat-copy-toast');
    if (!triggers.length || !toast) return;

    const message = {{ cond (eq site.Language.Lang "zh") "微信号已复制：" "WeChat ID copied: " | jsonify | safeJS }};
    let toastTimer;

    const fallbackCopy = () => {
      const field = document.createElement('textarea');
      field.value = wechatId;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      document.execCommand('copy');
      field.remove();
    };

    const copyWechat = async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(wechatId);
        } else {
          fallbackCopy();
        }
        toast.textContent = message + wechatId;
        toast.classList.add('is-visible');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 2400);
      } catch {
        fallbackCopy();
      }
    };

    triggers.forEach((trigger) => {
      trigger.setAttribute('role', 'button');
      trigger.setAttribute('aria-label', {{ cond (eq site.Language.Lang "zh") "复制微信号" "Copy WeChat ID" | jsonify | safeJS }});
      trigger.addEventListener('click', (event) => {
        event.preventDefault();
        copyWechat();
      });
      trigger.addEventListener('keydown', (event) => {
        if (event.key === ' ') {
          event.preventDefault();
          copyWechat();
        }
      });
    });
  })();
</script>
{{- end -}}
